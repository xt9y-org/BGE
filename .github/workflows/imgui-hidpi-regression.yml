name: ImGui Scale Regression

'on':
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev

      - name: Install lwcgl v2.9.3
        run: |
          git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git /tmp/lwcgl
          make -C /tmp/lwcgl -j2 all
          sudo make -C /tmp/lwcgl install
          sudo ldconfig

      - name: Test ImGui framebuffer and style scale contract
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DBGE_INPUT_TEST -I. \
            -c Engine/input.c -o /tmp/bge-input.o
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. -IVendor/imgui -I/usr/local/include/lwcgl-2.9.3 \
            tests/imgui_framebuffer_scale.cpp \
            Engine/imgui_impl_lwcgl.cpp \
            Vendor/imgui/imgui.cpp Vendor/imgui/imgui_draw.cpp \
            Vendor/imgui/imgui_tables.cpp Vendor/imgui/imgui_widgets.cpp \
            /tmp/bge-input.o \
            -L/usr/local/lib -Wl,-rpath,/usr/local/lib -llwcgl \
            -o /tmp/bge-imgui-scale
          /tmp/bge-imgui-scale

      - name: Test explicit BGE ImGui size scaling
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. -IEngine -IVendor/imgui -I/usr/local/include/lwcgl-2.9.3 \
            tests/imgui_ui_scale_contract.cpp \
            Engine/imgui_c.cpp Engine/imgui_impl_lwcgl.cpp \
            Vendor/imgui/imgui.cpp Vendor/imgui/imgui_draw.cpp \
            Vendor/imgui/imgui_tables.cpp Vendor/imgui/imgui_widgets.cpp \
            Vendor/imgui/imgui_impl_opengl3.cpp \
            /tmp/bge-input.o \
            -L/usr/local/lib -Wl,-rpath,/usr/local/lib -llwcgl -lGL \
            -o /tmp/bge-imgui-ui-scale
          /tmp/bge-imgui-ui-scale

      - name: Test ImGui scene mouse capture policy
        if: always()
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I. -IEngine -IVendor/imgui -I/usr/local/include/lwcgl-2.9.3 \
            tests/imgui_mouse_capture_contract.cpp \
            Engine/imgui_c.cpp Engine/imgui_impl_lwcgl.cpp \
            Vendor/imgui/imgui.cpp Vendor/imgui/imgui_draw.cpp \
            Vendor/imgui/imgui_tables.cpp Vendor/imgui/imgui_widgets.cpp \
            Vendor/imgui/imgui_impl_opengl3.cpp \
            /tmp/bge-input.o \
            -L/usr/local/lib -Wl,-rpath,/usr/local/lib -llwcgl -lGL \
            -o /tmp/bge-imgui-mouse-capture
          /tmp/bge-imgui-mouse-capture

      - name: Test ImGui frame ordering
        if: always()
        run: python3 tests/imgui_frame_order_contract.py
