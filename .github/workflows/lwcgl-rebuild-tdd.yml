name: lwcgl-rebuild-tdd

on:
  push:
    branches:
      - rebuild/lwcgl-v2.9.3

permissions:
  contents: read

jobs:
  input-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install lwcgl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libglfw3-dev libgl1-mesa-dev \
            libglu1-mesa-dev xvfb
      - name: Install lwcgl migration branch
        run: |
          git clone --depth 1 --branch bge-logical-window-size https://github.com/xt9y/lwcgl.git /tmp/lwcgl
          make -C /tmp/lwcgl -j2 all
          sudo make -C /tmp/lwcgl install
      - name: Build input edge contract
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DBGE_INPUT_TEST -I. -I/usr/local/include/lwcgl-2.9.3 \
            tests/input_edges.c Engine/input.c \
            -L/usr/local/lib -Wl,-rpath,/usr/local/lib -llwcgl -lm \
            -o /tmp/bge-input-edges
      - name: Run input edge contract
        run: /tmp/bge-input-edges
