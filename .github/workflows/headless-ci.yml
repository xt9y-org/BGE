name: BGE Headless CI

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - rebuild/lwcgl-v2.9.3
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    name: Full headless validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout BGE
        uses: actions/checkout@v4

      - name: Install graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config \
            libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev \
            mesa-utils xauth xvfb

      - name: Install lwcgl v2.9.3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf /tmp/lwcgl
            if git clone --depth 1 --branch v2.9.3 https://github.com/xt9y/lwcgl.git /tmp/lwcgl; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          make -C /tmp/lwcgl -j2 all
          sudo make -C /tmp/lwcgl install
          sudo ldconfig
          test -f /usr/local/include/lwcgl-2.9.3/lwcgl/lwcgl.h
          test -e /usr/local/lib/liblwcgl.so

      - name: Verify dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/usr/local/include/lwcgl-2.9.3' build.c
          grep -q -- '-llwcgl' build.c
          if grep -E -n 'git clone|curl|wget' build.c; then
            echo 'build.c must not download dependencies'
            exit 1
          fi
          if grep -R -n -E 'GLFW/|glfw[A-Z_]|<glad/|imgui_impl_glfw' \
              --include='*.c' --include='*.h' --include='*.cpp' \
              Engine main.c build.c; then
            echo 'direct GLFW/GLAD dependency remains in BGE source'
            exit 1
          fi

      - name: Test input edge contract
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DBGE_INPUT_TEST -I. -I/usr/local/include/lwcgl-2.9.3 \
            tests/input_edges.c Engine/input.c \
            -L/usr/local/lib -Wl,-rpath,/usr/local/lib -llwcgl -lm \
            -o /tmp/bge-input-edges
          /tmp/bge-input-edges

      - name: Install C-BuildSystem
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf /tmp/xt9y-c
            if git clone --depth 1 https://github.com/xt9y/C-BuildSystem.git /tmp/xt9y-c; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          make -C /tmp/xt9y-c -j2
          sudo make -C /tmp/xt9y-c install
          c --version

      - name: Install RendererCheck
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf /tmp/renderercheck
            if git clone --depth 1 https://github.com/xt9y/RendererCheck.git /tmp/renderercheck; then
              break
            fi
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          make -C /tmp/renderercheck -j2
          sudo make -C /tmp/renderercheck install
          renderercheck version
          renderercheck help >/dev/null

      - name: RendererCheck environment
        run: renderercheck doctor --verbose

      - name: Build full engine through C
        run: |
          c build
          test -x ./build/debug/bge

      - name: Verify software OpenGL
        run: xvfb-run -a glxinfo -B

      - name: Headless boot smoke test
        shell: bash
        run: |
          set -u
          set +e
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --signal=TERM --kill-after=2s 5s ./build/debug/bge
          status=$?
          set -e
          case "$status" in
            0|124|143) ;;
            *)
              echo "BGE headless smoke test failed with exit code $status"
              exit "$status"
              ;;
          esac

      - name: Test runtime and software-renderer classification
        run: |
          set -euo pipefail
          renderercheck run runtime
          test -s .rendercheck/runtime/metrics.txt
          grep -q '^gpu_ms=' .rendercheck/runtime/metrics.txt
          grep -q '"renderer_mode": "software"' .rendercheck/results.json
          grep -q '"timing_kind": "software_render"' .rendercheck/results.json

      - name: Test deterministic visual baseline and approve flow
        run: |
          set -euo pipefail
          rm -rf rendercheck/baselines .rendercheck/visual .rendercheck/run-performance
          if renderercheck run visual; then
            echo 'RendererCheck unexpectedly passed without a visual baseline'
            exit 1
          fi
          test -s .rendercheck/visual/actual.ppm
          test -s .rendercheck/visual/actual.png
          grep -q 'baseline missing' .rendercheck/results.json
          renderercheck approve visual
          test -s rendercheck/baselines/visual.ppm
          test -s .rendercheck/run-performance/baseline.tsv
          renderercheck run visual
          renderercheck diff visual

      - name: Test visual regression and PNG diff artifact
        run: |
          set -euo pipefail
          BASELINE="$(find rendercheck/baselines -type f -name '*.ppm' -print -quit)"
          test -n "$BASELINE"
          BASELINE="$BASELINE" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['BASELINE'])
          data = bytearray(path.read_bytes())
          pos = 0
          for _ in range(3):
              pos = data.index(ord('\n'), pos) + 1
          for i in range(pos, len(data)):
              data[i] ^= 0xff
          path.write_bytes(data)
          PY
          if renderercheck run visual; then
            echo 'RendererCheck unexpectedly accepted an inverted baseline'
            exit 1
          fi
          test -s .rendercheck/visual/diff.ppm
          test -s .rendercheck/visual/diff.png
          renderercheck approve visual
          renderercheck run visual

      - name: Test process performance failure policy
        run: |
          set -euo pipefail
          cp rendercheck.toml /tmp/rendercheck.toml.saved
          trap 'mv /tmp/rendercheck.toml.saved rendercheck.toml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rendercheck.toml')
          path.write_text(path.read_text().replace('max_process_ms = 20000.0', 'max_process_ms = 0.001'))
          PY
          if renderercheck run runtime; then
            echo 'RendererCheck unexpectedly accepted an impossible process budget'
            exit 1
          fi
          mv /tmp/rendercheck.toml.saved rendercheck.toml
          trap - EXIT

      - name: Test complete multi-test run and reports
        run: |
          set -euo pipefail
          renderercheck run
          test -s .rendercheck/report.md
          test -s .rendercheck/results.json
          test -f .rendercheck/runtime/stdout.log
          test -s .rendercheck/visual/actual.png
          grep -q '"schema_version": 1' .rendercheck/results.json

      - name: Upload RendererCheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderercheck-${{ github.run_id }}
          path: |
            .rendercheck/
            rendercheck/baselines/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
